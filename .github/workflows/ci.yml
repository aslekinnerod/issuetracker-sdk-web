name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job needs nothing but read access; without this block GITHUB_TOKEN
# gets the repository default, which on older repos is read-and-write
# across contents, packages and issues — live on every push to main while
# `pnpm install` runs this package's own `prepare`/tsup lifecycle script.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          # Pinned exactly so CI and local resolve the same installer —
          # the installer decides node_modules layout, which is what made
          # @types/node visible locally and invisible in CI (5ca9205).
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Assert the tarball npm would publish actually contains every
      # entry point package.json promises. Runs here too, not only in
      # publish.yml, so a tsup/exports change is caught on the PR rather
      # than on the tag.
      - run: pnpm verify:package
